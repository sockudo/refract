[package]
name = "refract-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
build = "build.rs"

[features]
default = ["runtime-compio", "app-echo", "codec-opus"]
runtime-compio = []
app-echo = []
codec-opus = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "refract"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
core_affinity.workspace = true
metrics.workspace = true
refract-admin = { path = "../refract-admin" }
refract-cluster = { path = "../refract-cluster" }
refract-config = { path = "../refract-config" }
refract-core = { path = "../refract-core" }
refract-obs = { path = "../refract-obs" }
refract-resilience = { path = "../refract-resilience" }
refract-sfu = { path = "../refract-sfu" }
refract-signal = { path = "../refract-signal" }
signal-hook.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
