name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-cyclonedx
      - uses: sigstore/cosign-installer@v3
      - run: cargo xtask release
      - run: cargo cyclonedx --all --format json --output-file target/refract-sbom.json
      - run: tar -czf target/refract-artifacts.tar.gz target/release-lto
      - run: sha256sum target/refract-artifacts.tar.gz target/refract-sbom.json > target/SHA256SUMS
      - run: cosign sign-blob --yes target/refract-artifacts.tar.gz --bundle target/refract-artifacts.tar.gz.bundle
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            target/refract-artifacts.tar.gz
            target/refract-artifacts.tar.gz.bundle
            target/refract-sbom.json
            target/SHA256SUMS
