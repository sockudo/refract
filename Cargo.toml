[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["refract contributors"]
description = "Production-grade Rust SFU workspace for single-edge Stage 1 delivery."
readme = "README.md"
repository = "https://github.com/refract-labs/refract"
homepage = "https://github.com/refract-labs/refract"
documentation = "https://docs.rs/refract"
keywords = ["sfu", "webrtc", "rtp", "media", "realtime"]
categories = ["multimedia", "network-programming"]

[workspace.dependencies]
arc-swap = "=1.9.2"
aya = { version = "=0.14.0", default-features = false }
aws-lc-rs = "=1.17.1"
bincode = { version = "=2.0.1", features = ["derive"] }
bytes = "=1.12.1"
clap = { version = "=4.6.1", features = ["derive"] }
compio = { version = "=0.19.0-rc.2", default-features = false, features = ["time"] }
compio-buf = "=0.8.3"
core_affinity = "=0.8.3"
criterion = { version = "=0.8.2", default-features = false }
crossbeam-queue = "=0.3.13"
figment = { version = "=0.10.19", features = ["env", "toml"] }
governor = { version = "=0.10.4", default-features = false, features = ["std"] }
io-uring = "=0.7.13"
jsonwebtoken = { version = "=10.4.0", features = ["aws_lc_rs"] }
libc = "=0.2.186"
loom = "=0.7.2"
metrics = "=0.24.6"
notify = "=9.0.0-rc.4"
openraft = { version = "=0.9.24", features = ["generic-snapshot-data", "serde"] }
ordered-float = "=5.3.0"
quinn = { version = "=0.11.11", default-features = false, features = ["rustls-aws-lc-rs"] }
rand = "=0.10.2"
rcgen = { version = "=0.14.8", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
redb = "=4.1.0"
redis = { version = "=1.3.0", default-features = false, features = ["script", "sentinel"] }
rkyv = { version = "=0.8.17", default-features = true }
rustls = { version = "=0.23.41", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { version = "=1.15.0", features = ["std"] }
rtrb = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
signal-hook = "=0.4.4"
socket2 = "=0.6.4"
sockudo-ws = { git = "https://github.com/sockudo/sockudo-ws.git", default-features = false }
strum = { version = "=0.28.0", features = ["derive"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tracing = "=0.1.44"
tracing-opentelemetry = "=0.33.0"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json", "registry"] }
xshell = "=0.3.0-pre.2"

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
single_use_lifetimes = "deny"
unsafe_op_in_unsafe_fn = "deny"
let_underscore_drop = "deny"
rust_2024_compatibility = "deny"

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.dev]
debug = 2
incremental = true

[profile.release]
opt-level = 3
debug = "line-tables-only"
lto = "thin"
codegen-units = 16
panic = "unwind"

[profile.release-native]
inherits = "release"

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
debug = "line-tables-only"
lto = "fat"
codegen-units = 1
