[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["refract contributors"]
description = "Production-grade Rust SFU workspace for single-edge Stage 1 delivery."
readme = "README.md"
repository = "https://github.com/refract-labs/refract"
homepage = "https://github.com/refract-labs/refract"
documentation = "https://docs.rs/refract"
keywords = ["sfu", "webrtc", "rtp", "media", "realtime"]
categories = ["multimedia", "network-programming"]

[workspace.dependencies]
aws-lc-rs = "=1.17.0"
clap = { version = "=4.6.1", features = ["derive"] }
compio = { version = "=0.19.0-rc.2", default-features = false, features = ["time"] }
compio-buf = "=0.8.2-rc.1"
criterion = { version = "=0.8.2", default-features = false }
crossbeam-queue = "=0.3.12"
io-uring = "=0.7.12"
libc = "=0.2.186"
metrics = "=0.24.6"
ordered-float = "=5.3.0"
rand = "=0.10.1"
rcgen = { version = "=0.14.8", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
rustls = { version = "=0.23.37", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { version = "=1.14.1", features = ["std"] }
sha2 = "=0.11.0"
socket2 = "=0.6.3"
strum = { version = "=0.28.0", features = ["derive"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tracing = "=0.1.44"
xshell = "=0.3.0-pre.2"

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
single_use_lifetimes = "deny"
unsafe_op_in_unsafe_fn = "deny"
let_underscore_drop = "deny"
rust_2024_compatibility = "deny"

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.dev]
debug = 2
incremental = true

[profile.release]
opt-level = 3
debug = "line-tables-only"
lto = "thin"
codegen-units = 16
panic = "unwind"

[profile.release-native]
inherits = "release"

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
debug = "line-tables-only"
lto = "fat"
codegen-units = 1
